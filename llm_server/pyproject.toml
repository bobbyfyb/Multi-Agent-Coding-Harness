[project]
name = "llm-server"
version = "0.1.0"
description = "Local vLLM server environment for Qwen2.5-Coder."
requires-python = ">=3.12"
dependencies = [
    "tokenizers==0.21.4",
    "transformers==4.55.2",
    "vllm==0.10.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
